# ============================================================
# Задача 30: CI/CD Pipeline — GitHub Actions
# Этапы: lint → security → test → build → deploy → smoke
# Цель: сборка < 8 минут
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mcp-bot

jobs:

  # ── 1. Линтинг (ruff + mypy) ──────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint deps
        run: pip install ruff mypy types-requests

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format check
        run: ruff format --check .

      - name: mypy strict
        run: mypy . --strict --ignore-missing-imports --exclude venv
        continue-on-error: true   # mypy strict — предупреждение, не блокирует


  # ── 2. Security scan ──────────────────────────────────────
  security:
    name: Security (bandit + safety)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tools
        run: pip install bandit safety

      - name: bandit scan
        run: bandit -r . -x ./venv,./tests -ll

      - name: safety check
        run: safety check --file requirements.txt
        continue-on-error: true   # safety иногда даёт ложные срабатывания


  # ── 3. Тесты + Coverage ───────────────────────────────────
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    env:
      GROQ_API_KEY: gsk_test_mock_key_for_ci
      TELEGRAM_BOT_TOKEN: "123456:ABC-DEF-test"
      ADMIN_ID: "7777777"
      DB_HOST: localhost
      DB_USER: botuser
      DB_PASS: botpass
      DB_NAME: botdb
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=handlers --cov-report=term-missing \
                 --cov-fail-under=80 \
                 -v tests/

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false


  # ── 4. Docker build + push ────────────────────────────────
  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, security, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tag = git commit SHA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx (кеш слоёв)
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy — сканирование образа на уязвимости
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: "0"          # предупреждение, не блокирует
          severity: CRITICAL,HIGH


  # ── 5. Deploy на staging ──────────────────────────────────
  deploy_staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/mcp-bot
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull bot
            docker compose up -d --no-deps bot
            docker compose ps

      # Smoke-тест после деплоя
      - name: Smoke test staging
        run: |
          sleep 10
          curl -f https://${{ secrets.STAGING_HOST }}/health || exit 1
          echo "✅ Staging smoke test passed"


  # ── 6. Deploy на production (ручное подтверждение) ────────
  deploy_production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production      # environment в GitHub с required reviewers
      url: https://your-production-domain.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/mcp-bot
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull bot
            docker compose up -d --no-deps bot
            docker compose ps

      # Smoke-тест после деплоя в production
      - name: Smoke test production
        run: |
          sleep 15
          curl -f https://${{ secrets.PROD_HOST }}/health || exit 1
          echo "✅ Production smoke test passed"
