name: CI/CD Pipeline
 
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
 
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mcp-bot
 
jobs:
 
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint deps
        run: pip install ruff mypy
      - name: ruff check
        run: ruff check . --output-format=github
        continue-on-error: true
      - name: ruff format check
        run: ruff format --check .
        continue-on-error: true
      - name: mypy
        run: mypy . --ignore-missing-imports --exclude venv --exclude tests
        continue-on-error: true
 
  security:
    name: Security (bandit + safety)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security tools
        run: pip install bandit safety
      - name: bandit scan
        run: bandit -r . -x ./venv,./tests -ll
        continue-on-error: true
      - name: safety check
        run: safety check --file requirements.txt
        continue-on-error: true
 
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    env:
      GROQ_API_KEY: gsk_test_mock_key_for_ci
      TELEGRAM_BOT_TOKEN: "123456:ABC-DEF-test"
      ADMIN_ID: "7777777"
      DB_HOST: localhost
      DB_USER: botuser
      DB_PASS: botpass
      DB_NAME: botdb
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest --cov=handlers --cov-report=term-missing \
                 --cov-fail-under=80 \
                 -v tests/
        continue-on-error: true
 
  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, security, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          target: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true
 
  deploy_staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/mcp-bot
            docker compose pull bot
            docker compose up -d --no-deps bot
        continue-on-error: true
 
  deploy_production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-domain.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/mcp-bot
            docker compose pull bot
            docker compose up -d --no-deps bot
        continue-on-error: true