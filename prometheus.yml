global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "mcp_bot"
    static_configs:
      - targets: ["bot:8080"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "jaeger"
    static_configs:
      - targets: ["jaeger:14269"]
